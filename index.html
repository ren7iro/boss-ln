<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Time 1.5</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #fff;
            color: #222;
        }

        .header-row {
            display: grid;
            grid-template-columns: 1fr auto; 
            padding: 10px 0;
            border-bottom: 2px solid #222;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.75rem;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 100;
            letter-spacing: 0.5px;
            align-items: center;
        }

        .menu-btn {
            background: #222;
            color: #fff;
            border: none;
            padding: 4px 8px;
            font-size: 0.70rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 3px;
            letter-spacing: 0.5px;
        }

        .menu-btn:hover {
            background: #444;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 35px;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            padding: 10px;
            z-index: 1000;
            width: 180px;
            border-radius: 4px;
        }

        .menu-dropdown.active {
            display: block;
        }

        .menu-dropdown label {
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            padding: 4px 0;
            cursor: pointer;
            text-transform: uppercase;
        }

        .menu-dropdown input {
            margin-right: 8px;
            cursor: pointer;
        }

        /* Smaller Section Header Styles */
        .group-header {
            background-color: #f7f7f7;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 0.70rem;
            text-transform: uppercase;
            border-top: 1px solid #eaeaea;
            border-bottom: 1px solid #eaeaea;
            margin-top: 8px;
            letter-spacing: 0.5px;
            color: #555;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto; 
            padding: 12px 4px;
            font-size: 0.88rem;
            align-items: flex-start;
            border-bottom: 1px solid #f9f9f9;
        }

        .boss-info {
            display: flex;
            align-items: center;
            line-height: 1.2; 
        }

        .boss-name {
            font-weight: 500;
        }

        .col-time { 
            text-align: right; 
            min-width: 110px; 
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            font-size: 0.88rem;
            line-height: 1.2;
        }

        .right-top {
            font-weight: bold;
        }

        .right-bottom {
            font-size: 0.70rem;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .color-dead {
            color: #666666;
        }

        .color-alive {
            color: #008000;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            font-size: 0.8rem;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #333;
            border-radius: 50%;
            width: 24px; height: 24px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header-row">
    <div>boss time</div>
    <div style="position: relative;">
        <button class="menu-btn" id="menu-toggle-btn">Menu</button>
        <div class="menu-dropdown" id="menu-dropdown">
            <!-- Checkboxes injected dynamically -->
        </div>
    </div>
</div>

<div id="boss-list">
    <div class="status-container">
        <div class="loader"></div>
        <div>i mai skil, please wait..</div>
    </div>
</div>

<script>
    const CLOUDFLARE_WORKER_URL = "https://laghaim-proxy.launkk.workers.dev";

    let bossData = []; 
    let isFetching = false;
    const sectionVisibility = {};

    const mapNames = {
        "13": "turan",
        "19": "mobius",
        "26": "tritian",
        "20": "forlorn s1",
        "22": "forlorn s2",
        "23": "forlorn s3",
        "24": "forlorn s4",
        "21": "kruma",
        "25": "highland",
        "27": "venatus",
        "30": "saara",
        "31": "chaotic sky",
        "32": "frostgard",
        "Other": "laglamia"
    };

    const mapOrder = ["13", "19", "26", "20", "22", "23", "24", "21", "25", "27", "30", "31", "32", "Other"];

    const menuBtn = document.getElementById('menu-toggle-btn');
    const menuDropdown = document.getElementById('menu-dropdown');

    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuDropdown.classList.toggle('active');
    });

    document.addEventListener('click', () => {
        menuDropdown.classList.remove('active');
    });

    menuDropdown.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    function getMapGroup(name) {
        const match = name.match(/^\[(\d{2})\]/);
        return match ? match[1] : "Other";
    }

    function formatFullDuration(ms) {
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    async function fetchBossData() {
        if (isFetching) return; 
        isFetching = true;

        try {
            const res = await fetch(`${CLOUDFLARE_WORKER_URL}?t=${Date.now()}`);
            if (!res.ok) throw new Error('Worker communication failure');
            
            const data = await res.json();
            const now = new Date();
            
            bossData = Object.values(data).sort((a, b) => {
                const gA = getMapGroup(a.bossname), gB = getMapGroup(b.bossname);
                
                let indexA = mapOrder.indexOf(gA);
                let indexB = mapOrder.indexOf(gB);
                
                if (indexA === -1) indexA = 999;
                if (indexB === -1) indexB = 999;

                if (indexA !== indexB) {
                    return indexA - indexB;
                }

                const timeA = new Date(a.bosstime + "-03:00");
                const timeB = new Date(b.bosstime + "-03:00");
                const diffA = timeA - now;
                const diffB = timeB - now;

                const isAliveA = diffA <= 0;
                const isAliveB = diffB <= 0;

                if (isAliveA && !isAliveB) return -1;
                if (!isAliveA && isAliveB) return 1;

                if (isAliveA && isAliveB) {
                    return diffA - diffB;
                }

                return diffA - diffB;
            });
            
            updateMenuCheckboxes();
            renderList();
            isFetching = false;
        } catch (e) {
            isFetching = false;
            console.error("Sync interface error, retrying...", e);
            setTimeout(fetchBossData, 5000); 
        }
    }

    function updateMenuCheckboxes() {
        const activeGroups = [];
        bossData.forEach(boss => {
            const g = getMapGroup(boss.bossname);
            if (!activeGroups.includes(g)) activeGroups.push(g);
        });

        // Sort active groups according to mapOrder
        activeGroups.sort((a, b) => {
            let iA = mapOrder.indexOf(a);
            let iB = mapOrder.indexOf(b);
            return (iA === -1 ? 999 : iA) - (iB === -1 ? 999 : iB);
        });

        activeGroups.forEach(g => {
            if (sectionVisibility[g] === undefined) {
                sectionVisibility[g] = true;
            }
        });

        let html = '';
        activeGroups.forEach(g => {
            const labelName = mapNames[g] ? mapNames[g] : g;
            const isChecked = sectionVisibility[g] ? 'checked' : '';
            html += `
                <label>
                    <input type="checkbox" data-group="${g}" ${isChecked} onchange="toggleSection('${g}', this.checked)">
                    ${labelName}
                </label>
            `;
        });
        menuDropdown.innerHTML = html;
    }

    function toggleSection(group, isVisible) {
        sectionVisibility[group] = isVisible;
        renderList();
    }

    function renderList() {
        const container = document.getElementById('boss-list');
        if (!bossData.length) return;

        const now = new Date();
        const fragment = document.createDocumentFragment();
        
        let lastGroup = null;

        bossData.forEach((boss) => {
            const currentGroup = getMapGroup(boss.bossname);

            if (sectionVisibility[currentGroup] === false) {
                return;
            }

            if (currentGroup !== lastGroup) {
                lastGroup = currentGroup;

                const mapLabel = mapNames[currentGroup] ? `${mapNames[currentGroup]}:` : `${currentGroup}:`;

                const header = document.createElement('div');
                header.className = 'group-header';
                header.textContent = mapLabel;

                fragment.appendChild(header);
            }

            const targetTime = new Date(boss.bosstime + "-03:00");
            const diff = targetTime - now;

            const row = document.createElement('div');
            row.className = 'row';

            const infoCol = document.createElement('div');
            infoCol.className = 'boss-info';
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'boss-name';
            nameDiv.textContent = boss.bossname;
            infoCol.appendChild(nameDiv);

            const timeCol = document.createElement('div');
            timeCol.className = 'col-time';

            if (diff <= 0) {
                const elapsedMs = Math.abs(diff);
                timeCol.innerHTML = `
                    <span class="right-top color-alive">ALIVE</span>
                    <span class="right-bottom color-alive">${formatFullDuration(elapsedMs)} ago</span>
                `;
            } else {
                const timeStr = `${String(targetTime.getHours()).padStart(2, '0')}:${String(targetTime.getMinutes()).padStart(2, '0')}`;
                timeCol.innerHTML = `
                    <span class="right-top color-dead">${timeStr}</span>
                    <span class="right-bottom color-dead">${formatFullDuration(diff)}</span>
                `;
            }

            row.appendChild(infoCol);
            row.appendChild(timeCol);
            fragment.appendChild(row);
        });

        container.innerHTML = '';
        container.appendChild(fragment);
    }

    fetchBossData();
    setInterval(fetchBossData, 30000); 
    setInterval(renderList, 1000);

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'visible') fetchBossData();
    });
</script>
</body>
</html>
